<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>注音猜猜看</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fbf6ee;
    --bg-dot: #eadfcd;
    --ink: #2b2420;
    --ink-soft: #7a6d62;
    --paper: #ffffff;
    --line: #eee3d3;
    --shadow: 0 1px 0 rgba(43,36,32,.04), 0 14px 36px -14px rgba(80,55,30,.28);
    --c: #e8573f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1b1816; --bg-dot: #2c2724; --ink: #f4ece2; --ink-soft: #a99a8c;
      --paper: #26211e; --line: #3a332e; --shadow: 0 14px 36px -14px rgba(0,0,0,.6); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1816; --bg-dot: #2c2724; --ink: #f4ece2; --ink-soft: #a99a8c;
    --paper: #26211e; --line: #3a332e; --shadow: 0 14px 36px -14px rgba(0,0,0,.6); color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; }
  body {
    font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    color: var(--ink);
    background-color: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 1.2px, transparent 1.2px);
    background-size: 22px 22px;
    min-height: 100dvh;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--c); outline-offset: 3px; }

  .wrap {
    max-width: 620px; margin: 0 auto; padding-block: 24px 40px;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    display: flex; flex-direction: column; gap: 20px; min-height: 100dvh;
  }

  /* ---------- Header ---------- */
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .logo { display: inline-flex; gap: 4px; }
  .logo span {
    width: 30px; height: 30px; display: grid; place-items: center; border-radius: 9px;
    font-weight: 900; font-size: 15px; color: #fff; transform: rotate(var(--r));
    box-shadow: 0 3px 0 rgba(0,0,0,.12);
  }
  h1 { font-size: 22px; font-weight: 900; margin: 0; letter-spacing: .06em; }
  .icon-btn {
    width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--line); background: var(--paper);
    display: grid; place-items: center; box-shadow: var(--shadow); flex: none;
  }
  .icon-btn svg { width: 20px; height: 20px; }

  /* ---------- Progress ---------- */
  .count { display: flex; align-items: center; gap: 12px; font-size: 14px; color: var(--ink-soft); }
  .count b { color: var(--ink); font-size: 18px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .bar { flex: 1; height: 8px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar div { height: 100%; background: var(--c); border-radius: 99px; transition: width .4s cubic-bezier(.3,1.2,.5,1), background .4s; }

  /* ---------- Card ---------- */
  .card {
    background: var(--paper); border: 1px solid var(--line); border-radius: 32px; box-shadow: var(--shadow);
    padding: 40px 20px 28px; display: flex; flex-direction: column; align-items: center; gap: 28px;
    position: relative; overflow: hidden;
  }
  .card::before {
    content: ""; position: absolute; width: 260px; height: 260px; border-radius: 50%;
    background: var(--c); opacity: .09; right: -90px; top: -110px; transition: background .4s;
  }
  .card.enter .tiles { animation: enter .45s cubic-bezier(.3,1.3,.5,1); }
  @keyframes enter { from { opacity: 0; transform: translateX(var(--dx, 30px)) rotate(2deg); } }

  .tiles { display: flex; gap: clamp(14px, 5vw, 26px); position: relative; }
  .tile {
    width: clamp(118px, 34vw, 170px); aspect-ratio: 1 / 1.1; border-radius: 28px;
    display: grid; place-items: center; font-weight: 700; font-size: clamp(64px, 19vw, 96px); line-height: 1;
    color: var(--c); border: 3px solid var(--c);
    background: color-mix(in srgb, var(--c) 10%, var(--paper));
    box-shadow: 0 6px 0 color-mix(in srgb, var(--c) 35%, transparent);
    transition: color .4s, border-color .4s, background .4s;
  }
  .tile:nth-child(1) { transform: rotate(-3deg); }
  .tile:nth-child(2) { transform: rotate(2.5deg); }

  .reveal { display: flex; flex-direction: column; align-items: center; gap: 12px; min-height: 120px; justify-content: center; position: relative; width: 100%; }
  .peek {
    border: 1.5px dashed var(--line); background: transparent; border-radius: 999px;
    padding: 9px 18px; font-size: 14px; font-weight: 700; color: var(--ink-soft);
    display: inline-flex; align-items: center; gap: 6px; transition: background .2s, color .2s, border-color .2s;
  }
  .peek:hover { background: var(--bg); color: var(--ink); border-color: var(--ink-soft); }
  .peek svg { width: 16px; height: 16px; }
  .ans { display: none; flex-direction: column; align-items: center; gap: 10px; animation: pop .4s cubic-bezier(.3,1.5,.5,1); }
  .reveal.open .ans { display: flex; }
  .ans .main { font-size: clamp(40px, 11vw, 56px); font-weight: 900; letter-spacing: .1em; line-height: 1.1; }
  .ans .alt { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; font-size: 14px; color: var(--ink-soft); }
  .ans .alt span { background: var(--bg); border: 1px solid var(--line); padding: 4px 12px; border-radius: 99px; color: var(--ink); }
  @keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.94); } }

  /* ---------- Nav ---------- */
  .nav { display: grid; grid-template-columns: 1fr 1.4fr; gap: 12px; }
  .btn {
    border: 0; border-radius: 18px; padding: 17px 12px; font-weight: 900; font-size: 17px;
    display: flex; align-items: center; justify-content: center; gap: 8px; box-shadow: 0 4px 0 rgba(0,0,0,.14);
    transition: transform .12s, box-shadow .12s, opacity .2s;
  }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 rgba(0,0,0,.14); }
  .btn:disabled { opacity: .35; pointer-events: none; }
  .btn.ghost { background: var(--paper); color: var(--ink); border: 1px solid var(--line); }
  .btn.solid { background: var(--ink); color: var(--bg); }
  .btn svg { width: 20px; height: 20px; }

  footer { margin-top: auto; text-align: center; color: var(--ink-soft); font-size: 13px; }
  kbd { font-family: inherit; font-size: 12px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 6px; padding: 1px 6px; background: var(--paper); }

  @media (max-width: 520px) {
    .wrap { padding-block: 16px 28px; gap: 16px; }
    .card { padding: 32px 16px 22px; gap: 22px; border-radius: 28px; }
    footer .kb { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="wrap">
  <header>
    <div class="brand">
      <div class="logo" aria-hidden="true">
        <span style="background:#e8573f;--r:-6deg">ㄓ</span>
        <span style="background:#3fae72;--r:5deg">ㄧ</span>
      </div>
      <h1>注音猜猜看</h1>
    </div>
    <button class="icon-btn" id="shuffle" aria-label="重新洗牌" title="重新洗牌">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3h5v5M4 20L21 3M21 16v5h-5M15 15l6 6M4 4l5 5"/></svg>
    </button>
  </header>

  <div class="count"><span>第 <b id="no">1</b> / <span id="total">50</span> 題</span><div class="bar"><div id="prog"></div></div></div>

  <section class="card" id="card">
    <div class="tiles" id="tiles"></div>
    <div class="reveal" id="reveal">
      <button class="peek" id="peek">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <span id="peekText">看參考答案</span>
      </button>
      <div class="ans"><div class="main" id="main"></div><div class="alt" id="alt"></div></div>
    </div>
  </section>

  <div class="nav">
    <button class="btn ghost" id="prev">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>上一題</button>
    <button class="btn solid" id="next">下一題
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>

  <footer>看注音開頭，說出一個兩個字的詞！<span class="kb"><br>電腦可用 <kbd>←</kbd><kbd>→</kbd> 換題、<kbd>空白鍵</kbd> 看答案</span></footer>
</main>

<script>
/* 題庫：注音開頭:參考答案/其他也可以的答案 */
const DATA = `
ㄆㄍ:蘋果/排骨
ㄒㄐ:香蕉/選舉/休假
ㄒㄍ:西瓜/性格/香港
ㄆㄊ:葡萄/普通/旁聽
ㄇㄍ:芒果/美國/玫瑰
ㄈㄌ:鳳梨/法律/福利
ㄘㄇ:草莓/聰明
ㄌㄏ:老虎/蘭花/靈魂
ㄕㄗ:獅子/數字/柿子
ㄉㄒ:大象/東西/地下
ㄒㄇ:熊貓/小貓/西門
ㄏㄗ:猴子/孩子/盒子
ㄊㄗ:兔子/梯子/投資
ㄨㄍ:烏龜/外國
ㄏㄊ:海豚/回頭/黑糖
ㄏㄉ:蝴蝶/活動/花朵
ㄐㄆ:雞排/機票
ㄉㄏ:豆花/電話/大海
ㄇㄕ:麻糬/魔術/美食
ㄧㄕ:醫生/意思/牙刷
ㄌㄕ:老師/律師/歷史
ㄐㄔ:警察/機車/機場
ㄔㄕ:廚師/城市/出生
ㄙㄐ:司機/三角
ㄍㄕ:歌手/故事/高手
ㄌㄑ:籃球/冷氣/力氣
ㄗㄑ:足球/早起
ㄅㄑ:棒球/抱歉
ㄆㄅ:跑步/旁邊/皮包
ㄏㄒ:滑雪/好笑/或許
ㄑㄔ:汽車/清楚
ㄍㄔ:公車/工廠/過程
ㄏㄔ:火車/好吃/紅茶
ㄈㄐ:飛機/放假/附近
ㄐㄩ:捷運/教育
ㄊㄅ:台北/特別/圖表
ㄍㄒ:高雄/高興/感謝
ㄐㄌ:基隆/距離/經理
ㄇㄐ:毛巾/美金/面積
ㄐㄉ:剪刀/雞蛋/經典
ㄑㄅ:鉛筆/錢包/全部
ㄅㄒ:冰箱/不行
ㄉㄕ:電視/但是/讀書
ㄕㄈ:沙發/師父/收費
ㄊㄒ:拖鞋/同學/天下
ㄊㄧ:太陽/同意/體育
ㄩㄌ:月亮/原來/娛樂
ㄒㄒ:星星/學校/消息
ㄊㄈ:颱風/頭髮
ㄕㄇ:沙漠/什麼/睡眠
`.trim().split("\n").map(l => { const [z, a] = l.split(":"); return { z: [...z], a: a.split("/") }; });

const COLORS = ["#e8573f", "#f0a030", "#3fae72", "#3b74d9", "#8a5cc9", "#d4578f", "#2f9fb3", "#b4703f"];
const $ = id => document.getElementById(id);
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.random() * (i + 1) | 0; [a[i], a[j]] = [a[j], a[i]]; } return a; };

let deck = shuffle(DATA), idx = 0;
$("total").textContent = deck.length;

function render(dir = 1) {
  const q = deck[idx];
  const color = COLORS[idx % COLORS.length];
  document.documentElement.style.setProperty("--c", color);
  $("tiles").innerHTML = q.z.map(s => `<div class="tile">${s}</div>`).join("");
  $("main").textContent = q.a[0];
  $("alt").innerHTML = q.a.length > 1 ? "也可以：" + q.a.slice(1).map(w => `<span>${w}</span>`).join("") : "";
  setOpen(false);
  $("no").textContent = idx + 1;
  $("prog").style.width = ((idx + 1) / deck.length * 100) + "%";
  $("prev").disabled = idx === 0;
  $("next").firstChild.textContent = idx === deck.length - 1 ? "重新開始" : "下一題";
  const card = $("card");
  card.style.setProperty("--dx", (dir * 30) + "px");
  card.classList.remove("enter"); void card.offsetWidth; card.classList.add("enter");
}

function setOpen(open) {
  $("reveal").classList.toggle("open", open);
  $("peekText").textContent = open ? "收起答案" : "看參考答案";
}

function go(step) {
  if (step > 0 && idx === deck.length - 1) { deck = shuffle(DATA); idx = 0; return render(1); }
  const n = idx + step;
  if (n < 0 || n >= deck.length) return;
  idx = n; render(step);
}

$("peek").addEventListener("click", () => setOpen(!$("reveal").classList.contains("open")));
$("prev").addEventListener("click", () => go(-1));
$("next").addEventListener("click", () => go(1));
$("shuffle").addEventListener("click", () => { deck = shuffle(DATA); idx = 0; render(1); });
document.addEventListener("keydown", e => {
  if (e.key === "ArrowRight") go(1);
  else if (e.key === "ArrowLeft") go(-1);
  else if (e.key === " ") { e.preventDefault(); setOpen(!$("reveal").classList.contains("open")); }
});

/* 手機左右滑動換題 */
let sx = null;
$("card").addEventListener("touchstart", e => { sx = e.touches[0].clientX; }, { passive: true });
$("card").addEventListener("touchend", e => {
  if (sx == null) return;
  const dx = e.changedTouches[0].clientX - sx; sx = null;
  if (Math.abs(dx) > 50) go(dx < 0 ? 1 : -1);
});

render(1);
</script>
</body>
</html>
